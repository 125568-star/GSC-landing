<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="SimpleTools website shown in the same laptop frame as the other websites">
<!-- Same laptop chassis/background graphic as Discover Brisbane, with the SimpleTools homepage inside the screen. -->
<image width="480" height="360" href="data:image/avif;base64,"/>
<defs><clipPath id="screen"><rect x="62" y="35" width="356" height="207" rx="2"/></clipPath></defs>
<g clip-path="url(#screen)">
  <svg x="62" y="35" width="356" height="207" viewBox="0 0 1200 698" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="simpletools-hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf6ff"/><stop offset="1" stop-color="#d9edff"/></linearGradient><linearGradient id="simpletools-mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173f99"/><stop offset="1" stop-color="#08a6cc"/></linearGradient></defs>
    <rect width="1200" height="698" fill="#f5f8ff"/>
    <rect width="1200" height="76" fill="#ffffff"/>
    <rect x="44" y="17" width="42" height="42" rx="10" fill="url(#simpletools-mark)"/>
    <path d="M57 30h17M57 39h17M57 48h12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="102" y="49" fill="#102f66" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="29">SimpleTools</text>
    <text x="850" y="48" fill="#69788f" font-family="Arial,Helvetica,sans-serif" font-size="16">Useful tools. No fuss. Always free.</text>
    <rect y="76" width="1200" height="59" fill="#fff"/>
    <rect x="46" y="84" width="72" height="43" rx="9" fill="#2563eb"/>
    <text x="64" y="112" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="15" fill="#fff">Home</text>
    <g fill="#28558f" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="15">
      <text x="139" y="111">Calculator</text><text x="278" y="111">Password Generator</text><text x="509" y="111">Word Counter</text>
      <text x="674" y="111">Text Case Converter</text><text x="900" y="111">Percentage Calculator</text>
    </g>
    <rect y="135" width="1200" height="45" fill="#f5f9ff"/>
    <text x="258" y="163" fill="#1956ba" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="15">★  Click here to bookmark this page so you can come back to it easier</text>
    <rect y="180" width="1200" height="518" fill="url(#simpletools-hero)"/>
    <text x="65" y="285" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="16" letter-spacing="3" fill="#2563eb">WELCOME TO SIMPLETOOLS</text>
    <text x="65" y="387" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="79" fill="#12254b">Everyday tasks.</text>
    <text x="65" y="480" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="79" fill="#1873dc">Made simple.</text>
    <text x="66" y="535" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#60718a">Handy, free tools for the little things you do every day.</text>
    <text x="66" y="565" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#60718a">No sign-ups, no complicated menus — just open a tool and get things done.</text>
    <rect x="65" y="599" width="260" height="60" rx="12" fill="#206de1"/>
    <text x="88" y="636" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold">Start with Calculator →</text>
    <rect x="340" y="599" width="251" height="60" rx="12" fill="#fff" stroke="#b7d0f5" stroke-width="2"/>
    <text x="366" y="636" fill="#24558f" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold">Generate a Password</text>
