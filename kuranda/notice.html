<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Notice | Kuranda</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f7;color:#173047;font:16px system-ui,sans-serif}header{padding:20px max(20px,calc((100vw - 850px)/2));background:white;border-bottom:1px solid #d9e6e3;display:flex;justify-content:space-between;align-items:center}a{color:#12695e}.wrap{max-width:850px;margin:35px auto;padding:0 20px}.card{background:white;border:1px solid #d9e6e3;border-radius:16px;padding:28px}label{font-weight:600;display:block;margin-top:18px}input,textarea{width:100%;padding:13px;margin-top:6px;font:inherit;border:1px solid #bbcfc9;border-radius:9px}textarea{min-height:180px}button{background:#137b6e;color:white;padding:12px 18px;border:0;border-radius:9px;font:inherit;cursor:pointer}.hidden{display:none}p{line-height:1.6}</style></head><body><header><a href="./"><strong>Kuranda</strong></a><button id="logout">Sign out</button></header><main class="wrap"><p><a href="dashboard.html">← Back to dashboard</a></p><div class="card"><h1>Add Community Notice</h1><p id="status" role="status">Checking your permissions…</p><form id="notice-form" class="hidden"><label>Notice title<input id="title" maxlength="160" required></label><label>Notice details<textarea id="details" required></textarea></label><p><button type="submit">Publish Notice</button></p></form></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script><script>
const client=window.supabase.createClient('https://pulbcpjwxliwnmkiyfhe.supabase.co','sb_publishable_ljmRZCY1QvS4G64eDgTuUQ_GfWXky0x');
let user=null;
const status=document.getElementById('status'),form=document.getElementById('notice-form');
async function init(){const {data:{user:u},error:authError}=await client.auth.getUser();if(authError||!u){location.replace('login.html');return}user=u;const {data:p,error}=await client.from('kuranda_profiles').select('role,approved').eq('user_id',u.id).maybeSingle();if(error){status.textContent=error.message;return}if(!p||!p.approved||!['admin','body_corp'].includes(p.role)){status.textContent='Only Admin and Body Corporate members can add notices.';return}if(p.role==='admin'){const {data:a,error:roleError}=await client.from('kuranda_active_roles').select('active_role').eq('user_id',u.id).maybeSingle();if(roleError){status.textContent=roleError.message;return}if(a?.active_role==='owner'){status.textContent='Switch back to Admin of Community on your dashboard to publish notices.';return}}status.textContent='Publish a notice for approved community members.';form.classList.remove('hidden')}
form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;const {error}=await client.from('kuranda_notices').insert({title:document.getElementById('title').value.trim(),body:document.getElementById('details').value.trim(),created_by:user.id});button.disabled=false;if(error){status.textContent=error.message;return}location.assign('dashboard.html')};
document.getElementById('logout').onclick=async()=>{await client.auth.signOut();location.replace('login.html')};init();</script></body></html>
