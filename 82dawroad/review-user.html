<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review User | 82 Daw Road</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f7;color:#173047;font:16px system-ui,sans-serif}header{background:white;padding:20px max(20px,calc((100vw - 850px)/2));display:flex;justify-content:space-between}a{color:#12695e}.wrap{max-width:850px;margin:35px auto;padding:0 20px}.card{background:white;border:1px solid #d9e6e3;border-radius:16px;padding:28px}label{display:block;margin:20px 0 6px;font-weight:600}input,select{width:100%;padding:12px;border:1px solid #bacdc7;border-radius:8px;font:inherit}button{background:#137b6e;border:0;border-radius:8px;color:white;padding:12px 18px;cursor:pointer;font:inherit;margin:14px 10px 0 0}.secondary{background:#eee;color:#243c42}.hidden{display:none}.muted{color:#647977}dd{margin:3px 0 15px}dt{font-weight:bold}</style></head><body><header><a href="./"><strong>82 Daw Road</strong></a><button id="logout" class="secondary">Sign out</button></header><main class="wrap"><p><a href="dashboard.html">← Back to Admin Dashboard</a></p><section class="card"><h1>Review User</h1><p id="status" role="status">Checking Admin access…</p><form id="review-form" class="hidden"><dl><dt>Account ID</dt><dd id="account-id"></dd><dt>Current status</dt><dd id="current-status"></dd><dt>Registered</dt><dd id="registered-at"></dd></dl><label for="name">Full name</label><input id="name" maxlength="100" required><label for="unit">Townhouse number</label><input id="unit" maxlength="30" required><label for="role">Role</label><select id="role"><option value="occupier">Occupier</option><option value="owner">Owner</option><option value="body_corp">Body Corporate</option></select><div><button type="button" id="approve">Approve User</button><button type="button" id="deny" class="secondary">Do Not Approve</button></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script><script>
const db=window.supabase.createClient('https://pulbcpjwxliwnmkiyfhe.supabase.co','sb_publishable_ljmRZCY1QvS4G64eDgTuUQ_GfWXky0x');
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');let current=null;
async function init(){const {data:{user}}=await db.auth.getUser();if(!user){location.replace('login.html');return}const {data:p,error:pe}=await db.from('daw82_profiles').select('role,approved').eq('user_id',user.id).maybeSingle();if(pe||!['admin','body_corp'].includes(p?.role)||!p.approved){$('status').textContent='Only Admin or Body Corporate can review users.';return}const {data:a,error:ae}=await db.from('daw82_active_roles').select('active_role').eq('user_id',user.id).maybeSingle();if(p.role==='admin'&&(ae||a?.active_role==='owner')){$('status').textContent='Switch to Admin of Community on your dashboard before reviewing users.';return}if(!id||!/^[0-9a-f-]{36}$/i.test(id)){$('status').textContent='Invalid account link.';return}const {data,error}=await db.from('daw82_profiles').select('user_id,display_name,unit_number,role,approved,created_at').eq('user_id',id).maybeSingle();if(error||!data){$('status').textContent=error?.message||'User not found';return}current=data;$('status').textContent='Check these details before making an approval decision.';$('account-id').textContent=data.user_id;$('current-status').textContent=data.approved?'Approved':'Pending approval';$('registered-at').textContent=new Date(data.created_at).toLocaleString('en-AU');$('name').value=data.display_name||'';$('unit').value=data.unit_number||'';if(data.role==='admin'||(p.role==='body_corp'&&data.role==='body_corp')){$('status').textContent='Admin accounts cannot be modified on this page.';return}$('role').value=data.role;$('review-form').classList.remove('hidden')}
async function save(approved){if(!current)return;if(approved&&(!$('name').value.trim()||!$('unit').value.trim())){$('status').textContent='Enter a name and townhouse number before approving.';return}if(!approved&&!confirm('Keep this user unapproved?'))return;const buttons=[$('approve'),$('deny')];buttons.forEach(b=>b.disabled=true);const changes={approved};if(approved){changes.display_name=$('name').value.trim();changes.unit_number=$('unit').value.trim();changes.role=$('role').value}const {error}=await db.from('daw82_profiles').update(changes).eq('user_id',current.user_id);buttons.forEach(b=>b.disabled=false);if(error){$('status').textContent=error.message;return}location.assign('dashboard.html')}
$('approve').onclick=()=>save(true);$('deny').onclick=()=>save(false);$('logout').onclick=async()=>{await db.auth.signOut();location.replace('login.html')};init();
</script></body></html>
