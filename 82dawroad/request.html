<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add maintenance request | 82 Daw Road</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f7;color:#173047;font:16px system-ui,sans-serif}header{padding:20px max(20px,calc((100vw - 850px)/2));background:white;border-bottom:1px solid #d9e6e3;display:flex;justify-content:space-between;align-items:center}a{color:#12695e}.wrap{max-width:850px;margin:35px auto;padding:0 20px}.card{background:white;border:1px solid #d9e6e3;border-radius:16px;padding:28px}label{font-weight:600;display:block;margin-top:18px}input,textarea{width:100%;padding:13px;margin-top:6px;font:inherit;border:1px solid #bbcfc9;border-radius:9px}textarea{min-height:130px}button{background:#137b6e;color:white;padding:12px 18px;border:0;border-radius:9px;font:inherit;cursor:pointer}.hidden{display:none}p{line-height:1.6}</style></head><body><header><a href="./"><strong>82 Daw Road</strong></a><button id="logout">Sign out</button></header><main class="wrap"><p><a href="dashboard.html">← Back to dashboard</a></p><div class="card"><h1>Add maintenance request</h1><p id="status">Checking your membership…</p><form id="request-form" class="hidden"><label id="unit-label" class="hidden">Townhouse number<input id="unit" maxlength="30"></label><label>Issue title<input id="title" required maxlength="160"></label><label>Details<textarea id="details" required></textarea></label><p><button type="submit">Submit request</button></p></form></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script><script>
const client=window.supabase.createClient('https://pulbcpjwxliwnmkiyfhe.supabase.co','sb_publishable_ljmRZCY1QvS4G64eDgTuUQ_GfWXky0x');let user=null,profile=null;
async function init(){const result=await client.auth.getUser();user=result.data.user;if(!user){location.replace('login.html');return}const r=await client.from('daw82_profiles').select('role,approved,unit_number').eq('user_id',user.id).maybeSingle();profile=r.data;if(r.error){document.getElementById('status').textContent=r.error.message;return}if(!profile||!profile.approved||!['admin','resident','occupier'].includes(profile.role)){document.getElementById('status').textContent='Your account is not permitted to submit maintenance requests.';return}if(['resident','occupier'].includes(profile.role)&&!profile.unit_number.trim()){document.getElementById('status').textContent='Ask Admin to assign your townhouse number before submitting a request.';return}document.getElementById('status').textContent=profile.role==='admin'?'Admin: select the townhouse for this request.':'Your request will be linked to townhouse '+profile.unit_number+'.';document.getElementById('request-form').classList.remove('hidden');if(profile.role==='admin'){document.getElementById('unit-label').classList.remove('hidden');document.getElementById('unit').required=true;}}
document.getElementById('request-form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;const row={user_id:user.id,title:document.getElementById('title').value.trim(),details:document.getElementById('details').value.trim(),status:'new'};if(profile.role==='admin')row.unit_number=document.getElementById('unit').value.trim();const {error}=await client.from('daw82_requests').insert(row);button.disabled=false;if(error){document.getElementById('status').textContent=error.message;return}location.assign('dashboard.html')};document.getElementById('logout').onclick=async()=>{await client.auth.signOut();location.replace('login.html')};init();
</script></body></html>
